summary: SK Telecom does not author or operate an MCP server for its APIs. It does, however, publish every
  API reference on the ReadMe documentation platform, and each of the five SK open API documentation hubs
  exposes a live MCP endpoint at /mcp on the SK Telecom-branded hostname. Those endpoints are real — a
  JSON-RPC POST returns a well-formed JSON-RPC envelope — but tools/list and initialize both answer HTTP
  401 {"code":-32001,"message":"Authorization required"}, and the RFC 9728 descriptor names ReadMe's own
  authorization server (https://dash.readme.com/oidc) as the issuer. The tool set therefore cannot be
  introspected anonymously, and the tools are documentation-platform tools rather than tools generated
  per SK Telecom API operation. No MCP server for the SK open API gateway itself (apis.openapi.sk.com)
  was found on the portal, in the SK Telecom GitHub organisation, or in any public MCP registry.
authored_by: ReadMe (documentation platform), on SK Telecom-branded documentation hostnames

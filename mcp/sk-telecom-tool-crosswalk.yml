  not meet. The only MCP servers on SK Telecom hostnames are the documentation-platform MCP
  endpoints ReadMe exposes on the five *-skopenapi.readme.io hubs, and tools/list is
  auth-gated (HTTP 401, ReadMe's own OIDC issuer), so no tool name could be observed. Nothing
  in the public record binds an MCP tool to an SK open API operation. The honest result is a
  crosswalk with zero bound rows and 55 rest_only operations: every SK Telecom API operation
  is reachable only over REST with an appKey header, and no agent-facing tool wraps any of them.

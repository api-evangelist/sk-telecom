summary: >-
  SK Telecom publishes an interactive try-it console but no sandbox environment. There is one
  set of hosts, one gateway and one credential type: calls made from the console are live calls
  against apis.openapi.sk.com metered against the app's plan. There is no test mode, no test
  key prefix, no separate sandbox base URL, no fixture or trigger tooling and no time
  simulation. Free-tier daily quotas are the only thing standing in for a sandbox.
test_live_separation:
  modes: [live]
  key_prefixes: none
  separate_host: false
  note: >-
    The appKey issued in 마이페이지 > 앱 > 앱키 is a production key. No test/live distinction is
    documented anywhere on the portal.

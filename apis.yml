  description: >-
    Korean text-to-speech built on SK Telecom's own DNN speech-synthesis models and voice database,
    operated by SKT's speech synthesis technology team. Three documented operations — list TTS
    models, list the voices a model supports, and synthesize speech (with an optional timestamped
    variant). Authenticated with an appKey header issued from the SK open API dashboard.

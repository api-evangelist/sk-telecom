- aid: sk-telecom:sk-telecom-ovs-api
  name: SK Telecom OVS API
  description: >-
    OVS is SK Telecom's road-event alerting service. Twelve documented operations covering
    customer company lookup, registration/lookup/deletion of target devices, broadcast of alert
    messages to devices when a road incident occurs, and per-company event statistics and raw
    event data retrieval. TERMINATED: SK open API announced end of service on 2026-04-06 with
    effect from 2026-04-07 13:00 KST — roughly one day of notice — deleting the plans of every
    consuming app. The OpenAPI was never marked deprecated and the documentation hub is still
    online; the definition is retained here as a record of a sunset contract.
  humanURL: https://openapi.sk.com/
  baseURL: https://apis.openapi.sk.com/api/ovs

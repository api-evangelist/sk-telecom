- aid: sk-telecom:sk-telecom-facecan-api
  name: SK Telecom A. facecan API
  description: >-
    Face recognition and analysis API (published as "NUGU facecan"). Build a per-group, per-subject
    face database and then detect, recognize and extract landmarks from submitted JPEG images.
    Nine documented operations covering group, subject and face CRUD plus detect, recognize and
    landmark inference. Supported input 320x240 to 3840x2160, JPG/JPEG under 2 MB.
  humanURL: https://openapi.sk.com/products/detail?svcSeq=50
  baseURL: https://apis.openapi.sk.com/nugufacecan

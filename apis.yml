aid: sk-telecom
url: https://raw.githubusercontent.com/api-evangelist/sk-telecom/refs/heads/main/apis.yml
name: SK Telecom
kind: company
description: >-
  SK Telecom Co., Ltd. is South Korea's largest mobile network operator, headquartered at SK T-Tower
  in Jung-gu, Seoul, and the telecom arm of SK Group. It runs the country's largest 5G and LTE
  network, sells fixed broadband and IPTV through subsidiary SK Broadband, operates the T world
  retail and care channel, and has repositioned itself as an "AI company" around its A.X sovereign
  Korean LLM family, the NUGU voice assistant, and the A. (A dot) assistant. Its position in the
  telecom value chain is that of a facilities-based incumbent carrier: it owns the radio access
  network, spectrum, SIM base, and identity rails that the rest of the Korean digital economy
  authenticates against. Its API posture is split in an unusual way. SK Telecom does run a genuine,
  self-serve public developer portal — SK open API at openapi.sk.com, operated by SK Telecom Co., Ltd.
  — but what it publishes there is AI, big-data and mobility product APIs (speech synthesis, face
  recognition, congestion and floating-population analytics, video analysis), not network APIs. The
  legacy T developers subdomains developer.sktelecom.com and developers.sktelecom.com both resolve in
  DNS to 211.188.149.18 and refuse connections on port 443 — a dead developer programme with dangling
  hostnames. On the network-API side SK Telecom is a named CAMARA participant and appears in the
  CAMARA landscape as an operator, has an organisation page in GSMA's Open Gateway directory, signed
  a domestic MoU with KT and LG Uplus in October 2024 to standardise six network APIs through Korea's
  TTA, endorsed the Bridge Alliance API Exchange, and signed an MoU with Aduna through subsidiary
  SK telink in September 2025 — but no CAMARA endpoint (Number Verification, SIM Swap, KYC Match,
  Quality on Demand) is callable from any SK Telecom-operated developer portal. Developers who want
  SK Telecom network capability reach it through aggregators — Bridge Alliance BAEx on Singtel's
  Paragon platform, surfaced through Nokia's Network as Code developer portal, or Aduna — not from
  SK Telecom directly.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg

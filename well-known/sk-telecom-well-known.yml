generated: '2026-07-25'
method: searched
source: live probes of every apis.yml baseURL host, OpenAPI servers[] host and docs host
summary: >-
  SK Telecom serves no /.well-known/ discovery surface of its own. The developer portal
  (openapi.sk.com), the API gateway (apis.openapi.sk.com) and the corporate site
  (www.sktelecom.com) return 404/403 for security.txt, openid-configuration,
  oauth-authorization-server, oauth-protected-resource, api-catalog and ai-plugin.json.
  The only /.well-known/ documents that resolve anywhere in SK Telecom's developer surface
  are RFC 9728 OAuth protected-resource descriptors for the MCP endpoints on the five
  *-skopenapi.readme.io documentation hubs, which are provided by the ReadMe documentation
  platform SK Telecom publishes its API reference on. They point at ReadMe's own
  authorization server (https://dash.readme.com/oidc), not at an SK Telecom IdP.
hosts:
- host: https://openapi.sk.com
  role: developer portal
  documents:
  - {path: /.well-known/security.txt, status: 404}
  - {path: /security.txt, status: 404}
  - {path: /.well-known/openid-configuration, status: 404}
  - {path: /.well-known/oauth-authorization-server, status: 404}
  - {path: /.well-known/oauth-protected-resource, status: 404}
  - {path: /.well-known/api-catalog, status: 404}
  - {path: /.well-known/ai-plugin.json, status: 404}
  - {path: /llms.txt, status: 404}
- host: https://apis.openapi.sk.com

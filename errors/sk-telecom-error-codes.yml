- api: SK Telecom META API
  spec: openapi/sk-telecom-meta-openapi.json
  docs: https://meta-skopenapi.readme.io/reference/error-code-2
  http_statuses:
  - {status: 204, message: No Content, cause: File missing / file upload success (multipart form), operations: [create_analyzer, get_result]}

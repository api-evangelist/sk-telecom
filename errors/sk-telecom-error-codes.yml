docs:
- url: https://openapi.sk.com/support/notice/detailView?ntiSeq=309
  name: Gateway 공통 에러코드 변경 안내 (gateway common error codes, effective 2023-02-02)
  http_status: 200
- url: https://nugufacecan-skopenapi.readme.io/reference/error-codes
  name: A. facecan Error Codes
  http_status: 200
- url: https://meta-skopenapi.readme.io/reference/error-code-2
  name: META Error Code
  http_status: 200
format: proprietary
envelope:
  shape: '{"error": {"id": "<http status>", "category": "<gw|...>", "code": "<ERROR_CODE>", "message": "<message>"}}'
  example: '{"error":{"id":"401","category":"gw","code":"UNAUTHORIZED","message":"Unauthorized"}}'
  note: >-
    Not RFC 9457. SK open API uses a proprietary envelope with a nested error object. The
    scheme changed on 2023-02-02 from numeric codes (8001, 8101, 8102, 8104, 8105, 7104,
    9999, 8901) to symbolic codes (UNAUTHORIZED, INVALID_API_KEY, THROTTLED, ...). Product
    APIs behind the gateway use their own flat {"message": ..., "code": <int>} envelope.
gateway_errors:
  scope: All APIs behind https://apis.openapi.sk.com/
  effective: '2023-02-02'
  category: gw
  codes:
  - {status: 401, code: UNAUTHORIZED, message: Unauthorized, reason: Call made without an appKey}
  - {status: 403, code: INVALID_API_KEY, message: Forbidden, reason: Call made with an invalid appKey}
  - {status: 403, code: ACCESS_DENIED, message: Authorized IP Address only, reason: Blocked by IP whitelist}
  - {status: 403, code: MISSING_AUTHENTICATION_TOKEN, message: Missing Authentication Token, reason: Call to a non-existent API or HTTP method}
  - {status: 429, code: THROTTLED, message: Too Many Requests, reason: Per-second call rate exceeded}
  - {status: 429, code: QUOTA_EXCEEDED, message: Limit Exceeded, reason: SLA / plan call quota exceeded}
  - {status: 500, code: API_CONFIGURATION_ERROR, message: Internal server error, reason: Gateway internal error}
  - {status: 504, code: INTEGRATION_FAILURE, message: Network error communicating with endpoint, reason: Backend routing error}
  retired_codes:
    note: Numeric scheme in force before 2023-02-02, retained for archaeology.
    codes:
    - {status: 400, code: E.GW.METHOD_NOT_ALLOWED, message: '{Method} not permited'}
    - {status: 400, code: E.GW.INVALID_APIKEY, message: Invalid API Key}
    - {status: 400, code: '-1', message: The host does not exist or the host is down when routing}
    - {status: 400, code: '-2', message: The Routing URL is incorrect}
    - {status: 400, code: '-3', message: Connection Timeout occured when routing}
    - {status: 400, code: '-5', message: An unknown type of error has occurred when routing}
    - {status: 401, code: '8001', message: 유효하지 않은 API Key입니다.}
    - {status: 403, code: '8101', message: 초당/분당/시간당 처리 건수를 초과했습니다.}
    - {status: 403, code: '8102', message: 최대 호출 허용 건수를 초과했습니다.}
    - {status: 403, code: '8104', message: 접근권한이 없는 IP주소입니다.}
    - {status: 403, code: '8105', message: 서비스 제한 시간입니다.}
    - {status: 404, code: '404', message: Gateway service not found}
    - {status: 405, code: '7104', message: 허용하지 않는 HTTP Method입니다.}
    - {status: 408, code: '-4', message: Read Timeout occured when routing}
    - {status: 500, code: GW000, message: The request failed due to some unknown reason}
    - {status: 500, code: '9999', message: Gateway 내부 오류가 발생하였습니다.}
    - {status: 503, code: '8901', message: 라우팅에 실패했습니다.}

method: searched
source: >-
  https://openapi.sk.com/support/notice/detailView?ntiSeq=309 (gateway throttle classes) and
  https://openapi.sk.com/support/notice/detailView?ntiSeq=311 (published free-tier daily quota
  table), cross-checked against the 429 responses declared in openapi/*.json.
docs: https://openapi.sk.com/support/notice/detailView?ntiSeq=311
summary: >-
  The SK open API gateway enforces two distinct limits: a call-rate throttle (per second, per
  minute and per hour) and a plan call quota. Both are signalled as HTTP 429 with symbolic
  codes in the proprietary error envelope. SK Telecom publishes no rate-limit response headers
  (no X-RateLimit-*, no Retry-After documented) and no general quota reference page — the only
  concrete numbers in the public record are the free-tier daily quotas published in the
  2023-03-17 Geovision Puzzle quota-reduction notice, reproduced verbatim below.
signalling:
  headers: none documented
  status: 429
  codes:
  - {code: THROTTLED, status: 429, meaning: Too Many Requests — per-second call rate exceeded}
  - {code: QUOTA_EXCEEDED, status: 429, meaning: Limit Exceeded — plan/SLA call quota exceeded}
  - {code: ACCESS_DENIED, status: 403, meaning: Caller IP is not on the app's whitelist}
  retired_codes:
  - {code: '8101', status: 403, meaning: per-second / per-minute / per-hour call count exceeded (pre-2023-02-02)}
  - {code: '8102', status: 403, meaning: maximum allowed call count exceeded (pre-2023-02-02)}
throttle_classes: [per-second, per-minute, per-hour]
throttle_note: >-
  The pre-2023 error table names all three windows explicitly ("초당/분당/시간당 처리 건수를 초과했습니다"),
  so the gateway throttles on all three. The concrete values are set per app plan in the
  authenticated dashboard and are not published.

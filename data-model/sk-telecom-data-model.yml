source: >-
  openapi/*.json — path structure, path parameters, request/response schema properties and
  id-reference fields across all six SK Telecom OpenAPI 3.1.0 documents.
summary: >-
  There is no shared SK Telecom data model. The six specs define six disjoint entity graphs
  with no cross-references, no common identifier scheme and no components.schemas reuse (every
  schema is inlined at the operation). The only recurring shape across products is the
  application itself — the app and its appKey issued from the portal — which is not modelled
  in any spec.

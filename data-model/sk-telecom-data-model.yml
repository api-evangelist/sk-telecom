observations:
- No components.schemas reuse in any spec — every request and response schema is inlined,
  so there is nothing for a generator to name or share.
- No entity crosses a product boundary; the only shared concept is the portal application.
- Two specs use Korean-language operationIds, which blocks idiomatic client generation.

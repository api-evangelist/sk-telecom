  spec: openapi/sk-telecom-facecan-openapi.json
  entities:
  - name: app
    id_field: app-id
    carried_in: header
    note: Portal-issued application identifier; not returned by any operation.
  - name: group
    id_field: group_id
    fields: [group_id, group_name]
    operations: [group-list, group-create, group-delete]
  - name: subject
    id_field: subject_id
    fields: [subject_id, subject_name, group_name]
    operations: [subject-list, subject-create, subject-delete]
  - name: face
    id_field: face_id
    fields: [face_id, face_name, box, face_score, expression, expression_score, age, gender,
      attribute, image_width, image_height, engine_version]
    operations: [subject-list-1, face-create, face-delete]
  relationships:
  - {from: app, to: group, kind: has_many, via: app-id}
  - {from: group, to: subject, kind: has_many, via: group-id}
  - {from: subject, to: face, kind: has_many, via: subject-id}
  - {from: face, to: subject, kind: belongs_to, via: subject-id}
  inference_operations:
  - {operation: face-detect-1, input: image, output: face boxes, persists: false}
  - {operation: face-landmark-1, input: image, output: landmark points, persists: false}
  - {operation: face-recognize-1, input: image + group-id, output: matched subject, persists: false}
  uniqueness: subject_name must be unique within an (app, group) pair (error 2004).

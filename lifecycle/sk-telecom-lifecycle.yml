deprecation:
  policy_published: false
  policy_url: null
  announcement_channel: https://openapi.sk.com/support/notice/listView
  sunset_header: false
  deprecation_header: false
  note: >-
    SK open API publishes no written deprecation policy, no notice period commitment and no
    RFC 8594 Sunset/Deprecation headers. Deprecation happens as a dated 공지사항 (notice) on the
    portal notice board, and the observed notice period is extremely short: the OVS and LITMUS
    APIs were announced terminated on 2026-04-06 with an effective time of 2026-04-07 13:00
    KST — roughly one day. Plans attached to consuming apps are deleted at termination.
  sunset_events:
  - api: SK Telecom OVS API
    spec: openapi/sk-telecom-ovs-openapi.json
    announced: '2026-04-06'
    effective: '2026-04-07T13:00+09:00'
    notice_period_days: 1
    url: https://openapi.sk.com/support/notice/detailView?ntiSeq=357
    reason: Terminated at the provider's discretion (제공사의 사정)
    consumer_impact: Plans removed from consuming apps; calls stop returning valid results.
  - api: LITMUS API
    announced: '2026-04-06'
    effective: '2026-04-07T13:00+09:00'
    notice_period_days: 1
    reason: Open API distribution discontinued; the LITMUS data product continues off-API.
    note: Not catalogued as an SK Telecom API in apis.yml (no spec was published).
  breaking_changes:
  - {date: '2026-07-01', change: HTTP (port 80) calls blocked; HTTPS-only enforced with no redirect, url: 'https://openapi.sk.com/support/notice/detailView?ntiSeq=359'}
  - {date: '2023-03-27', change: Geovision Puzzle free-tier daily quotas cut (1000/day to 100/day on several API groups), url: 'https://openapi.sk.com/support/notice/detailView?ntiSeq=311'}
  - {date: '2023-02-02', change: Gateway common error codes changed from numeric to symbolic, url: 'https://openapi.sk.com/support/notice/detailView?ntiSeq=309'}
deprecated_operations: []
deprecated_operations_note: >-
  Every operation in all six OpenAPI documents carries deprecated:false. The OVS API was
  terminated wholesale on 2026-04-07 without the spec ever being marked deprecated — the
  machine-readable contract never reflected the sunset.
sla:
  url: null
  uptime_target: null
  note: No SLA or uptime commitment is published on the SK open API portal. The gateway does
    return a QUOTA_EXCEEDED error whose documented reason is "SLA 초과" (SLA exceeded), so an
    internal per-plan SLA exists, but its terms are not public.
status_page:

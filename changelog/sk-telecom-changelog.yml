  title: SK open API 보안 강화에 따른 불필요 포트 폐쇄 및 HTTP 접속 제한 일정 변경
  title_en: Revised schedule — unnecessary ports closed and HTTP access restricted
  kind: breaking
  breaking: true
  effective: '2026-07-01'
  scope: SK open API Gateway (apis.openapi.sk.com) and every API behind it
  highlights:
  - Port 80 (HTTP) closed; all API calls forced to HTTPS on port 443.
  - No automatic 80 to 443 redirect is provided — callers must edit their source.

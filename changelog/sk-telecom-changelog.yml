summary: >-
  SK open API has no developer changelog in the modern sense — no release notes page, no
  versioned CHANGELOG, no RSS. What it has is a dated Korean-language notice board (공지사항)
  at /support/notice/listView where gateway changes, error-code changes, quota reductions,
  maintenance windows and service terminations are announced. Notices are addressed by
  ntiSeq and are readable anonymously; the list view itself only renders the two pinned
  notices to an anonymous visitor, so the entries below were read by walking ntiSeq. Recent
  window only — this is not the full history.
scheme: dated notice board (공지사항), no version numbers
current_version: null
version_note: >-
  Each API carries its own path version segment (axtts has none, facecan /v1, META /golf/v1
  and /pose/v1, OVS /v20, Puzzle unversioned). There is no portal-wide API version.

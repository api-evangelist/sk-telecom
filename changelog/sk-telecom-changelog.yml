- date: '2023-02-02'
  seq: 309
  url: https://openapi.sk.com/support/notice/detailView?ntiSeq=309
  title: Gateway 공통 에러코드 변경 안내
  title_en: Gateway common error codes changed
  kind: breaking
  breaking: true
  effective: '2023-02-02'
  highlights:
  - Numeric gateway error codes (8001, 8101, 8102, 8104, 8105, 7104, 9999, 8901) replaced by
    symbolic codes (UNAUTHORIZED, INVALID_API_KEY, ACCESS_DENIED, MISSING_AUTHENTICATION_TOKEN,
    THROTTLED, QUOTA_EXCEEDED, API_CONFIGURATION_ERROR, INTEGRATION_FAILURE).
  - Error envelope retained as {"error":{"id","category","code","message"}}.
  - Full table captured in errors/sk-telecom-error-codes.yml.
